name: Daily Stock & Crypto Sync

on:
  push:
    branches: [ "main", "dev" ] # 코드를 올릴 때마다 자동 실행
  schedule:
    # UTC 기준 (한국 시각 = UTC + 9)
    # 한국 장 마감 후: 16시 KST = 07시 UTC
    - cron: '0 7 * * *'
    # 미국 및 코인 마감 후: 09시 KST = 00시 UTC
    - cron: '0 0 * * *'
    # NXT 한주 소식 시작 (모닝브리핑): 08:01 KST = 23:01 UTC (전일)
    - cron: '1 23 * * *'
    # NXT 및 전체 마감 (이브닝브리핑): 20:01 KST = 11:01 UTC
    - cron: '1 11 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date to sync (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: python updater.py ${{ github.event.inputs.target_date }}
