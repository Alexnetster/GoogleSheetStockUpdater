name: Daily Stock & Crypto Sync

on:
  push:
    branches: [ "main", "dev" ] # 코드를 올릴 때마다 자동 실행
  schedule:
    # UTC 기준 (한국 시각 = UTC + 9)
    # 한국 장 마감 후: 16시 KST = 07시 UTC
    - cron: '0 7 * * *'
    # NXT 한주 소식 시작 (모닝브리핑): 09:10 KST = 00:10 UTC
    - cron: '10 0 * * *'
    # 국장 오전 세션 (미드데이브리핑): 12:01 KST = 03:01 UTC
    - cron: '1 3 * * *'
    # NXT 및 전체 마감 (이브닝브리핑): 20:01 KST = 11:01 UTC
    - cron: '1 11 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date to sync (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            if [ "${{ github.event.schedule }}" == "10 0 * * *" ]; then MODE="MORNING";
            elif [ "${{ github.event.schedule }}" == "1 3 * * *" ]; then MODE="MIDDAY";
            elif [ "${{ github.event.schedule }}" == "0 7 * * *" ]; then MODE="CLOSE";
            elif [ "${{ github.event.schedule }}" == "1 11 * * *" ]; then MODE="EVENING";
            else MODE="AUTO"; fi
          else
            MODE="AUTO"
          fi
          python updater.py ${{ github.event.inputs.target_date }} --mode $MODE
